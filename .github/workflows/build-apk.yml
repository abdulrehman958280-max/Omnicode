name: Build apk

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.0'
  FLUTTER_VERSION: '3.38.7'
  ANDROID_PLATFORM_VERSION: '36'
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
  ANDROID_CMAKE_VERSION: '3.22.1'
  NDK_VERSION: '28.2.13676358'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: webchat/pnpm-lock.yaml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi

          "$SDKMANAGER" --licenses < <(yes) >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platforms;android-${{ env.ANDROID_PLATFORM_VERSION }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}" \
            "cmake;${{ env.ANDROID_CMAKE_VERSION }}" \
            "ndk;${{ env.NDK_VERSION }}"

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g
            -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            --no-daemon \
            --build-cache \
            --max-workers=4 \
            :app:assembleDevelopStandardDebug \
            -Ptarget=lib/main_standard.dart

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/developStandard/debug/app-develop-standard-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Omnicode-debug-apk
          path: app/build/outputs/apk/developStandard/debug/app-develop-standard-debug.apk
          if-no-files-found: error
          retention-days: 14
